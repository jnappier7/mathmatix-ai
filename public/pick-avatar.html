<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Avatar! | M∆THM∆TIΧ AI</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/css/avatar-builder.css" />
  <link rel="stylesheet" href="/css/avatar-picker.css" />
  <link rel="stylesheet" href="/css/ux-enhancements.css" />
  <!-- Font Awesome, loaded once as CSS. The SVG-with-JS kit (js/all.min.js)
       used to be loaded alongside it: ~1.3MB of script that re-renders every
       <i> as an <svg>, on top of an icon font that had already painted them.
       Two copies of the same icon set, plus a visible reflow as the second
       replaced the first. Nothing in the codebase reads the injected SVG DOM. -->
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
</head>
<body class="landing-page-body">
  <header class="landing-header">
    <div class="header-logo-container"> <img src="/images/mathmatix-ai-logo.png" alt="Mathmatix AI Logo" class="main-logo-hero" /> </div>
    <nav class="landing-nav">
      <button id="logoutBtn" class="btn btn-tertiary">Logout</button>
    </nav>
  </header>

  <main class="pick-tutor-main" style="min-height: calc(100vh - 140px); overflow-y: auto; padding-bottom: 3rem;">
    <!-- Onboarding Stepper -->
    <div class="onboarding-stepper" style="margin-top: 2rem;">
      <div class="stepper-step completed">
        <div class="stepper-circle"></div>
        <span class="stepper-label">Profile</span>
      </div>
      <div class="stepper-connector completed"></div>
      <div class="stepper-step completed">
        <div class="stepper-circle"></div>
        <span class="stepper-label">Tutor</span>
      </div>
      <div class="stepper-connector completed"></div>
      <div class="stepper-step active">
        <div class="stepper-circle">3</div>
        <span class="stepper-label">Avatar</span>
      </div>
    </div>

    <!-- AVATAR SELECTION -->
    <section class="selection-section">
      <h1 class="section-title">Choose Your Avatar.</h1>
      <p class="subtitle">Pick the character that's you — or create your own.</p>

      <div id="avatar-selection-grid" class="avatar-selection-grid">
        <p style="text-align: center; color: var(--clr-text-dim);">Loading avatars...</p>
      </div>
    </section>

    <!-- ACTION BUTTON -->
    <div class="tutor-actions-bar" style="margin-top: 3rem;">
      <button id="complete-selection-btn" class="btn btn-select btn-large" disabled>
        <i class="fas fa-rocket"></i> Let's Go!
      </button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 M∆THM∆TIΧ AI. All rights reserved. <a href="/privacy.html">Privacy Policy</a> | <a href="/terms.html">Terms of Use</a></p>
    <p class="edtech-pledge">Proud member of the EdTech Equity Pledge.</p>
  </footer>

  <script src="/js/logout.js"></script>
  <script src="/js/csrf.js"></script>
  <script src="/js/avatar-config-data.js"></script>
  <script type="module" src="/js/pick-avatar.js"></script>
  <script src="/js/ux-enhancements.js"></script>
</body>
</html>
