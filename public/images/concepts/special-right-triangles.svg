<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Special right triangles: 45-45-90 with sides 1, 1, √2 and 30-60-90 with sides 1, √3, 2">
<rect x="0" y="0" width="640" height="262" fill="#ffffff"/>
<g data-special="45°–45°–90°" data-unit="120">
<text x="130" y="54" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">45°–45°–90°</text>
<polygon points="70,196 190,196 70,76" fill="#f5f3ff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 84 196 L 84 182 L 70 182" fill="none" stroke="#6d28d9" stroke-width="2"/>
<text x="130" y="218" font-size="17" font-weight="700" fill="#0f766e" text-anchor="middle" data-side="base">1</text>
<text x="60" y="141" font-size="17" font-weight="700" fill="#b45309" text-anchor="end" data-side="height">1</text>
<text x="142" y="130" font-size="17" font-weight="700" fill="#6d28d9" text-anchor="start" data-side="hyp">√2</text>
<text x="150" y="189" font-size="13.5" fill="#5b6475" text-anchor="middle" data-at="base">45°</text>
<text x="77" y="118" font-size="13.5" fill="#5b6475" text-anchor="start" data-at="top">45°</text>
</g>
<g data-special="30°–60°–90°" data-unit="120">
<text x="453.9" y="54" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">30°–60°–90°</text>
<polygon points="350,196 557.8,196 350,76" fill="#f5f3ff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 364 196 L 364 182 L 350 182" fill="none" stroke="#6d28d9" stroke-width="2"/>
<text x="453.9" y="218" font-size="17" font-weight="700" fill="#0f766e" text-anchor="middle" data-side="base">√3</text>
<text x="340" y="141" font-size="17" font-weight="700" fill="#b45309" text-anchor="end" data-side="height">1</text>
<text x="465.9" y="130" font-size="17" font-weight="700" fill="#6d28d9" text-anchor="start" data-side="hyp">2</text>
<text x="499.8" y="189" font-size="13.5" fill="#5b6475" text-anchor="middle" data-at="base">30°</text>
<text x="357" y="106" font-size="13.5" fill="#5b6475" text-anchor="start" data-at="top">60°</text>
</g>
<text x="130" y="246" font-size="13" fill="#5b6475" text-anchor="middle">legs equal · hypotenuse = leg × √2</text>
<text x="455" y="246" font-size="13" fill="#5b6475" text-anchor="middle">short leg 1 · long leg √3 · hypotenuse 2</text>
</svg>
