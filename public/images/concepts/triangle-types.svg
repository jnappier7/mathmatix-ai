<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 504" width="660" height="504" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Types of triangles: equilateral, isosceles and scalene by their sides; acute, right and obtuse by their angles">
<rect x="0" y="0" width="660" height="504" fill="#ffffff"/>
<text x="330" y="22" font-size="14" fill="#5b6475" text-anchor="middle">By their sides</text>
<text x="330" y="265" font-size="14" fill="#5b6475" text-anchor="middle">By their angles</text>
<g data-tri="Equilateral">
<text x="110" y="50" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Equilateral</text>
<text x="110" y="69" font-size="13.5" fill="#5b6475" text-anchor="middle">3 equal sides</text>
<polygon points="45,200 165,200 105,96.1" fill="#f5f3ff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="105" y1="193" x2="105" y2="207" stroke="#6d28d9" stroke-width="2.5"/>
<line x1="128.9" y1="151.5" x2="141.1" y2="144.5" stroke="#6d28d9" stroke-width="2.5"/>
<line x1="81.1" y1="151.5" x2="68.9" y2="144.5" stroke="#6d28d9" stroke-width="2.5"/>
</g>
<g data-tri="Isosceles">
<text x="330" y="50" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Isosceles</text>
<text x="330" y="69" font-size="13.5" fill="#5b6475" text-anchor="middle">2 equal sides</text>
<polygon points="275,200 375,200 325,75" fill="#f5f3ff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="344.6" y1="142.9" x2="357.6" y2="137.7" stroke="#6d28d9" stroke-width="2.5"/>
<line x1="342.4" y1="137.3" x2="355.4" y2="132.1" stroke="#6d28d9" stroke-width="2.5"/>
<line x1="307.6" y1="137.3" x2="294.6" y2="132.1" stroke="#6d28d9" stroke-width="2.5"/>
<line x1="305.4" y1="142.9" x2="292.4" y2="137.7" stroke="#6d28d9" stroke-width="2.5"/>
</g>
<g data-tri="Scalene">
<text x="550" y="50" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Scalene</text>
<text x="550" y="69" font-size="13.5" fill="#5b6475" text-anchor="middle">no equal sides</text>
<polygon points="485,200 615,200 580,115" fill="#f5f3ff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g data-tri="Acute">
<text x="110" y="293" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Acute</text>
<text x="110" y="312" font-size="13.5" fill="#5b6475" text-anchor="middle">all angles less than 90°</text>
<polygon points="45,443 170,443 95,338" fill="#f5f3ff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g data-tri="Right">
<text x="330" y="293" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Right</text>
<text x="330" y="312" font-size="13.5" fill="#5b6475" text-anchor="middle">one angle of 90°</text>
<polygon points="275,443 395,443 275,343" fill="#f5f3ff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 289 443 L 289 429 L 275 429" fill="none" stroke="#6d28d9" stroke-width="2"/>
</g>
<g data-tri="Obtuse">
<text x="550" y="293" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Obtuse</text>
<text x="550" y="312" font-size="13.5" fill="#5b6475" text-anchor="middle">one angle more than 90°</text>
<polygon points="530,443 625,443 485,363" fill="#f5f3ff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
</g>
</svg>
