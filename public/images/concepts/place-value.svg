<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 276" width="726" height="276" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Place value: in 4,572.386 the 4 is 4 thousands, the 5 is 5 hundreds, the 7 is 7 tens, the 2 is 2 ones, the 3 is 3 tenths, the 8 is 8 hundredths and the 6 is 6 thousandths">
<rect x="0" y="0" width="726" height="276" fill="#ffffff"/>
<rect x="16" y="20" width="96" height="44" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
<text x="64" y="47" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">thousands</text>
<rect x="16" y="64" width="96" height="92" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="64" y="128" font-size="52" font-weight="700" fill="#6d28d9" text-anchor="middle" data-digit="4" data-place="1000">4</text>
<text x="64" y="182" font-size="12.5" fill="#5b6475" text-anchor="middle">4 × 1,000</text>
<text x="64" y="202" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" data-worth="4000">= 4,000</text>
<rect x="112" y="20" width="96" height="44" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
<text x="160" y="47" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">hundreds</text>
<rect x="112" y="64" width="96" height="92" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="160" y="128" font-size="52" font-weight="700" fill="#6d28d9" text-anchor="middle" data-digit="5" data-place="100">5</text>
<text x="160" y="182" font-size="12.5" fill="#5b6475" text-anchor="middle">5 × 100</text>
<text x="160" y="202" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" data-worth="500">= 500</text>
<rect x="208" y="20" width="96" height="44" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
<text x="256" y="47" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">tens</text>
<rect x="208" y="64" width="96" height="92" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="256" y="128" font-size="52" font-weight="700" fill="#6d28d9" text-anchor="middle" data-digit="7" data-place="10">7</text>
<text x="256" y="182" font-size="12.5" fill="#5b6475" text-anchor="middle">7 × 10</text>
<text x="256" y="202" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" data-worth="70">= 70</text>
<rect x="304" y="20" width="96" height="44" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
<text x="352" y="47" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">ones</text>
<rect x="304" y="64" width="96" height="92" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="352" y="128" font-size="52" font-weight="700" fill="#6d28d9" text-anchor="middle" data-digit="2" data-place="1">2</text>
<text x="352" y="182" font-size="12.5" fill="#5b6475" text-anchor="middle">2 × 1</text>
<text x="352" y="202" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" data-worth="2">= 2</text>
<rect x="422" y="20" width="96" height="44" fill="#ccfbf1" stroke="#1f2937" stroke-width="1.5"/>
<text x="470" y="47" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">tenths</text>
<rect x="422" y="64" width="96" height="92" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="470" y="128" font-size="52" font-weight="700" fill="#0f766e" text-anchor="middle" data-digit="3" data-place="0.1">3</text>
<text x="470" y="182" font-size="12.5" fill="#5b6475" text-anchor="middle">3 × 0.1</text>
<text x="470" y="202" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" data-worth="0.3">= 0.3</text>
<rect x="518" y="20" width="96" height="44" fill="#ccfbf1" stroke="#1f2937" stroke-width="1.5"/>
<text x="566" y="47" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">hundredths</text>
<rect x="518" y="64" width="96" height="92" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="566" y="128" font-size="52" font-weight="700" fill="#0f766e" text-anchor="middle" data-digit="8" data-place="0.01">8</text>
<text x="566" y="182" font-size="12.5" fill="#5b6475" text-anchor="middle">8 × 0.01</text>
<text x="566" y="202" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" data-worth="0.08">= 0.08</text>
<rect x="614" y="20" width="96" height="44" fill="#ccfbf1" stroke="#1f2937" stroke-width="1.5"/>
<text x="662" y="47" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">thousandths</text>
<rect x="614" y="64" width="96" height="92" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="662" y="128" font-size="52" font-weight="700" fill="#0f766e" text-anchor="middle" data-digit="6" data-place="0.001">6</text>
<text x="662" y="182" font-size="12.5" fill="#5b6475" text-anchor="middle">6 × 0.001</text>
<text x="662" y="202" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" data-worth="0.006">= 0.006</text>
<circle cx="411" cy="140" r="6" fill="#1f2937"/>
<text x="411" y="16" font-size="11.5" fill="#5b6475" text-anchor="middle">decimal point</text>
<text x="363" y="250" font-size="14.5" fill="#5b6475" text-anchor="middle">Each place is worth 10 times the place to its right.</text>
</svg>
