<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The integers on a number line from −10 to 10: negatives to the left of zero, positives to the right, and −4 and 4 as opposites">
<rect x="0" y="0" width="720" height="222" fill="#ffffff"/>
<line x1="38" y1="120" x2="682" y2="120" stroke="#1f2937" stroke-width="2.5"/>
<path d="M 682 120 l -9 -5 v 10 z M 38 120 l 9 -5 v 10 z" fill="#1f2937"/>
<line x1="60" y1="112" x2="60" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="60" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-10">−10</text>
<line x1="90" y1="112" x2="90" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="90" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-9">−9</text>
<line x1="120" y1="112" x2="120" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="120" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-8">−8</text>
<line x1="150" y1="112" x2="150" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="150" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-7">−7</text>
<line x1="180" y1="112" x2="180" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="180" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-6">−6</text>
<line x1="210" y1="112" x2="210" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="210" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-5">−5</text>
<line x1="240" y1="112" x2="240" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="240" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-4">−4</text>
<line x1="270" y1="112" x2="270" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="270" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-3">−3</text>
<line x1="300" y1="112" x2="300" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="300" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-2">−2</text>
<line x1="330" y1="112" x2="330" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="330" y="148" font-size="13.5" fill="#be185d" text-anchor="middle" data-tick="-1">−1</text>
<line x1="360" y1="112" x2="360" y2="128" stroke="#1f2937" stroke-width="3"/>
<text x="360" y="148" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle" data-tick="0">0</text>
<line x1="390" y1="112" x2="390" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="390" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="1">1</text>
<line x1="420" y1="112" x2="420" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="420" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="2">2</text>
<line x1="450" y1="112" x2="450" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="450" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="3">3</text>
<line x1="480" y1="112" x2="480" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="480" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="4">4</text>
<line x1="510" y1="112" x2="510" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="510" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="5">5</text>
<line x1="540" y1="112" x2="540" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="540" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="6">6</text>
<line x1="570" y1="112" x2="570" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="570" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="7">7</text>
<line x1="600" y1="112" x2="600" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="600" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="8">8</text>
<line x1="630" y1="112" x2="630" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="630" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="9">9</text>
<line x1="660" y1="112" x2="660" y2="128" stroke="#1f2937" stroke-width="1.5"/>
<text x="660" y="148" font-size="13.5" fill="#0f766e" text-anchor="middle" data-tick="10">10</text>
<text x="195" y="178" font-size="15" font-weight="700" fill="#be185d" text-anchor="middle">← negative numbers</text>
<text x="525" y="178" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">positive numbers →</text>
<text x="360" y="178" font-size="13.5" fill="#5b6475" text-anchor="middle">zero</text>
<circle data-opposite="-4" cx="240" cy="120" r="6" fill="#6d28d9"/>
<path d="M 360 106 Q 300 46 240 106" fill="none" stroke="#6d28d9" stroke-width="2"/>
<text x="300" y="68" font-size="12.5" fill="#6d28d9" text-anchor="middle">4 steps</text>
<circle data-opposite="4" cx="480" cy="120" r="6" fill="#6d28d9"/>
<path d="M 360 106 Q 420 46 480 106" fill="none" stroke="#6d28d9" stroke-width="2"/>
<text x="420" y="68" font-size="12.5" fill="#6d28d9" text-anchor="middle">4 steps</text>
<text x="360" y="30" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="middle">−4 and 4 are opposites: the same distance from zero</text>
<text x="360" y="208" font-size="14.5" fill="#5b6475" text-anchor="middle">Numbers get bigger as you move right.</text>
</svg>
