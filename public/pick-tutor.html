  <header class="landing-header">
    <div class="header-logo-container"> <img src="/images/mathmatix-ai-logo.png" alt="Mathmatix AI Logo" class="main-logo-hero" /> </div>
    <nav class="landing-nav">
      <button id="logoutBtn" class="btn btn-tertiary">Logout</button>
    </nav>
  </header>

  <main id="main-content" class="pick-tutor-main tp-main">
    <!-- Onboarding Stepper (hidden in switch mode by pick-tutor.js) -->
    <div class="onboarding-stepper" id="onboarding-stepper">
      <div class="stepper-step completed">
        <div class="stepper-circle"></div>
        <span class="stepper-label">Profile</span>
      </div>
      <div class="stepper-connector completed"></div>
      <div class="stepper-step active">
        <div class="stepper-circle">2</div>
        <span class="stepper-label">Tutor</span>
      </div>
    </div>

    <section class="tp-shell">
      <div class="tp-header">
        <h1 class="section-title" id="selection-title">Pick Your Tutor</h1>
        <p class="subtitle" id="selection-subtitle">Your coach guides every session and stands with you. Switch anytime.</p>
      </div>

      <div class="tp-layout">
        <div class="tp-stage">
          <div class="tp-roster" id="tutor-roster">
            <p style="margin:auto; color: var(--clr-text-dim);">Loading tutors…</p>
          </div>
        </div>
        <div class="tp-panel-wrap">
          <aside class="tp-panel" id="tutor-detail" aria-live="polite"></aside>
        </div>
      </div>

      <!-- Locked "special release" slots (variable-ratio unlockables) -->
      <div class="tp-locked" id="locked-shelf"></div>

      <!-- Escape hatch shown only when switching tutors -->
      <div class="tp-backbar" id="tp-backbar" style="display:none;">
        <a href="/chat.html" class="btn btn-tertiary"><i class="fas fa-arrow-left"></i> Back to Chat</a>
