<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Your Math Tutors! | M∆THM∆TIΧ AI</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/css/tutor-picker.css?v=20260713" />
  <link rel="stylesheet" href="/css/ux-enhancements.css" />
  <!-- Font Awesome, loaded once as CSS. The SVG-with-JS kit (js/all.min.js)
       used to be loaded alongside it: ~1.3MB of script that re-renders every
       <i> as an <svg>, on top of an icon font that had already painted them.
       Two copies of the same icon set, plus a visible reflow as the second
       replaced the first. Nothing in the codebase reads the injected SVG DOM. -->
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <script src="/js/analytics.js" data-ga="G-EMX73QXF5H" data-fbp=""></script>
</head>
<body class="landing-page-body">
  <a href="#main-content" class="skip-to-content">Skip to main content</a>
  <header class="landing-header">
    <div class="header-logo-container"> <img src="/images/mathmatix-ai-logo.png" alt="Mathmatix AI Logo" class="main-logo-hero" /> </div>
    <nav class="landing-nav">
      <button id="logoutBtn" class="btn btn-tertiary">Logout</button>
    </nav>
  </header>

  <main id="main-content" class="pick-tutor-main tp-main">
    <!-- Onboarding Stepper (hidden in switch mode by pick-tutor.js) -->
    <div class="onboarding-stepper" id="onboarding-stepper">
      <div class="stepper-step completed">
        <div class="stepper-circle"></div>
        <span class="stepper-label">Profile</span>
      </div>
      <div class="stepper-connector completed"></div>
      <div class="stepper-step active">
        <div class="stepper-circle">2</div>
        <span class="stepper-label">Tutor</span>
      </div>
    </div>

    <section class="tp-shell">
      <div class="tp-header">
        <h1 class="section-title" id="selection-title">Pick Your Tutor</h1>
        <p class="subtitle" id="selection-subtitle">Your coach guides every session and stands with you. Switch anytime.</p>
      </div>

      <div class="tp-layout">
        <div class="tp-stage">
          <div class="tp-roster" id="tutor-roster">
            <p style="margin:auto; color: var(--clr-text-dim);">Loading tutors…</p>
          </div>
        </div>
        <div class="tp-panel-wrap">
          <aside class="tp-panel" id="tutor-detail" aria-live="polite"></aside>
        </div>
      </div>

      <!-- Locked "special release" slots (variable-ratio unlockables) -->
      <div class="tp-locked" id="locked-shelf"></div>

      <!-- Escape hatch shown only when switching tutors -->
      <div class="tp-backbar" id="tp-backbar" style="display:none;">
        <a href="/chat.html" class="btn btn-tertiary"><i class="fas fa-arrow-left"></i> Back to Chat</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 M∆THM∆TIΧ AI. All rights reserved. <a href="/privacy.html">Privacy Policy</a> | <a href="/terms.html">Terms of Use</a></p>
    <p class="edtech-pledge">Proud member of the EdTech Equity Pledge.</p>
  </footer>

  <script src="/js/logout.js"></script>
  <script src="/js/csrf.js"></script>
  <script src="/js/tutor-config-data.js"></script>
  <script type="module" src="/js/pick-tutor.js"></script>
  <script src="/js/ux-enhancements.js"></script>
</body>
</html>
