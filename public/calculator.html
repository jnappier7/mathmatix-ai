    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | MATHMATIX.AI</title>
    <!--
      The standalone calculator page. Not a curiosity: browser-lock.js adds
      /calculator.html to the allowed-paths list when a teacher permits a
      calculator during a locked assessment, so this is the sanctioned
      calculator when a student is locked into a test.

      It used to carry its own 1,671-line TI-84 emulation (js/calculator.js) —
      a third implementation with a third evaluator and its own bugs, and the
      only one cosmetic skins never reached. It now renders the same shared
      component as chat and the ACT practice test.
    -->
    <link rel="stylesheet" href="/css/mm-calculator.css?v=20260801a">
    <link rel="stylesheet" href="/css/cosmetics.css?v=20260801a">
</head>
<body class="mmc-page">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WDF79L47"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<script src="/js/mmCalculator.js?v=20260801a"></script>
<script>
    (function () {
        // Always open and not closable: the calculator IS the page.
        var calc = window.MMCalculator.create({ closable: false, keyboard: true });
        calc.mount(document.body);
        calc.show();

        // Wear the student's equipped calculator skin here too — same
        // data-skin-calculator attribute every other surface uses. Best-effort
        // and silent: a skin is decoration, and a student locked into a test
        // needs the calculator far more than they need it in pink.
        fetch('/user', { credentials: 'include' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
                var skin = d && d.user && d.user.equippedCosmetics &&
                    d.user.equippedCosmetics.calculator;
                if (skin && skin !== 'default') {
                    document.body.setAttribute('data-skin-calculator', skin);
                }
            })
            .catch(function () { /* never block the calculator on a skin */ });
    })();
</script>
</body>
</html>
