<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fact Fluency | MATHMATIX AI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/images/favicon-256x256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Math&display=swap">
  <link rel="stylesheet" href="/css/live-drill.css?v=20261031">
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Math Facts · saved across games</div>
    <h1>Fact <span>Fluency</span></h1>
    <p>Every Math Facts game in the <a href="/live-drill">Live Two-Minute Drill</a> adds to each signed-in student's record, fact by fact. <b>Fluent</b> = right the last 2+ times, typically in 3 seconds or less.</p>
  </section>
  <div class="panel row">
    <div><label class="lbl" for="cls">Class</label><select id="cls" class="clsel"></select></div>
    <span class="muted" id="cls-note"></span>
    <button class="ghost" id="csv" style="margin-left:auto" disabled>Download class (CSV)</button>
  </div>
  <div class="err" id="err" role="alert"></div>
  <div class="panel facts" id="class-view" hidden></div>
  <div class="panel facts" id="student-view" hidden></div>
</div>
<script src="/js/live-drill/common.js?v=20261025"></script>
<script src="/js/live-drill/fluency-page.js?v=20261027"></script>
</body>
</html>
