name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  coverage-critical:
    # Per-file coverage ratchet on the highest-stakes logic (grading math, IRT,
    # knowledge tracing, the tutoring pipeline's decide/diagnose/verify stages).
    # Kept separate from `test` so it never perturbs the global coverage
    # threshold. See jest.critical.config.js — raise floors as coverage improves,
    # never lower them to make a red build green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Critical-path coverage gate
        run: npm run test:critical
        env:
          NODE_ENV: test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # scripts/buildPageBundles.js concatenates each page's CSS/JS into
      # content-hashed bundles, and the PAGES it covers load ONLY those bundles.
      # Editing a bundled source without re-running it is therefore silent: the
      # source is correct, review passes, and the change is simply never served.
      #
      # That is not hypothetical. `.catalog-drop-btn` — the only way to unenroll
      # from a course on a phone — shipped with zero of its six rules in the
      # served bundle, because the CSS was merged without a rebuild. It was found
      # by accident, weeks later.
      #
      # The bundler is a deterministic content hash over the same input, so a
      # clean tree in, clean tree out. Any diff here means a source file moved and
      # its bundle did not.
      - name: Page bundles match their sources
        run: |
          npm run build:bundles
          # Scope to public/ — `npm run build` (vite) writes to the gitignored
          # root /dist, so it can never make this dirty. --porcelain catches the
          # newly-hashed bundle files too, which `git diff` alone would miss
          # because they are untracked.
          if [ -n "$(git status --porcelain -- public)" ]; then
            echo "::error::Page bundles are stale — a bundled source was edited without rebuilding, so that change is NOT being served. Run 'npm run build:bundles' and commit the result."
            echo ""
            echo "Files the bundler changed:"
            git --no-pager status --porcelain -- public
            exit 1
          fi
          echo "Page bundles are in sync with their sources."

      - name: Build frontend
        run: npm run build
