# Nightly tutor-quality eval — the live LLM tier the PR gate can't run.
#
# 5 live-suite runs per evening of the model prod actually runs (gpt-4o-mini,
# the scripts/nightly-tutor-eval.sh default), aggregated into a pass-rate
# table in the job summary. Fails only on STABLE regressions (a test failing a
# majority of its runs for a model) — single-run flakes are listed but don't
# page. To trial another model, dispatch the workflow with `models` set —
# each extra model is ~$5.50 of Sonnet-class spend per night, which is why
# none is scheduled.
#
# Needs repo secrets: OPENAI_API_KEY (replies + all LLM judges) and, only when
# `models` names a claude model, ANTHROPIC_API_KEY.
name: Nightly tutor eval

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC ≈ 9:30 PM ET (8:30 PM during EST)
  workflow_dispatch:
    inputs:
      runs_per_model:
        description: 'Live-suite runs per model'
        default: '5'
        required: false
      models:
        description: 'Space-separated tutor models (default: the prod model only)'
        default: ''
        required: false

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run live eval matrix
        run: bash scripts/nightly-tutor-eval.sh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS_PER_MODEL: ${{ github.event.inputs.runs_per_model || '5' }}
          MODELS: ${{ github.event.inputs.models }}

      - name: Upload per-run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-logs
          path: eval-nightly-logs/
          retention-days: 30
